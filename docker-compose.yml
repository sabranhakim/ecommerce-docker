version: '3.8'
services:
  product-service:
    build: ./product-service
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: products
    depends_on:
      - mysql

  user-service:
    build: ./user-service
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/users
      JWT_SECRET: your_super_secret_jwt_key
    depends_on:
      - postgres

  cart-php:
    build: ./cart-service
    volumes:
      - ./cart-service:/var/www
    environment:
      DB_HOST: mysql
      DB_DATABASE: products
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      - mysql

  cart-nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./cart-service/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./cart-service:/var/www
    depends_on:
      - cart-php

  review-service:
    build: ./review-service
    ports:
      - "5002:5000"
    environment:
      - MONGO_URI=mongodb://admin:admin123@mongo:27017/
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_SERVER: mongo

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: products
    volumes:
      - mysql-data:/var/lib/mysql

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Adminer is a database management tool that you can access in your browser.
  # To use it, go to http://localhost:8080
  #
  # For PostgreSQL:
  # System: PostgreSQL
  # Server: postgres
  # Username: user
  # Password: password
  # Database: users
  #
  # For MySQL:
  # System: MySQL
  # Server: mysql
  # Username: root
  # Password: password
  # Database: products
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mysql

volumes:
  mysql-data:
  postgres-data:
  mongo-data:
