version: '3.8'
services:
  product-service:
    build: ./product-service
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: products
    depends_on:
      - mysql

  user-service:
    build: ./user-service
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/users
      JWT_SECRET: your_super_secret_jwt_key
    depends_on:
      - postgres

  cart-service:
    build: ./cart-service
    ports:
      - "8000:8000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      - product-service

  review-service:
    build: ./review-service
    ports:
      - "5000:5000"

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: products
    volumes:
      - mysql-data:/var/lib/mysql

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  mysql-data:
  postgres-data:
